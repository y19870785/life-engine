name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: 检出代码与迁移测试所需历史
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: 配置本地模拟合同测试所需 Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 记录测试环境
        run: |
          python --version
          node --version
      # setup.py 是部署入口；测试自行导入 runtime，只使用 Python 标准库。
      - name: 运行完整测试
        run: python -m unittest discover -s tests -v
